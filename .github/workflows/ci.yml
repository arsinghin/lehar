name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type-check (browser + Node ESM server)
        run: npm run typecheck

      - name: Lint (zero warnings)
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: Unit, integration and accessibility tests with coverage gates
        run: npm run test:coverage

      - name: Secret scan
        run: npm run check:secrets

      - name: Production build
        run: npm run build

      - name: Performance budget and CSP-safe HTML
        run: npm run check:size

      - name: Dependency audit (runtime)
        run: npm audit --omit=dev --audit-level=high

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (desktop + mobile, axe, CSP, keyboard, reflow)
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
